<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI NPU — Think. Fast. Local.</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/corechain-icon.svg" />
  <base href="/b/ai/" />
  <script>
    (function(){
      var origFetch = window.fetch;
      window.coreFetch = origFetch;
      window.fetch = function(input, init) {
        if (typeof input === 'string' && input.startsWith('/api/')) {
          input = '/b/ai' + input;
        }
        return origFetch.call(this, input, init);
      };
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <style>
    /* Swiss Army Knife Fan-Out Dock (Bottom-Right Pivot) */
    #ccSwissDock { position:fixed; bottom:16px; right:16px; z-index:9999; width:42px; height:42px; }
    .cc-blade {
      position:absolute; right:21px; top:50%;
      transform-origin: right center;
      transform: translateY(-50%) rotate(0deg) scale(0.2);
      opacity:0; pointer-events:none;
      padding:7px 14px 7px 12px; border-radius:999px; font-size:12px; font-weight:700;
      text-decoration:none; white-space:nowrap;
      background:#ffffff; color:#0f172a; border:1.5px solid #e2e8f0;
      box-shadow:0 6px 18px rgba(15,23,42,0.16);
      transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
    }
    .cc-blade.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    #ccSwissDock.open .cc-blade,
    #ccSwissDock:hover .cc-blade { opacity:1; pointer-events:auto; }
    #ccSwissDock.open .cc-b1, #ccSwissDock:hover .cc-b1 { transform: translateY(-50%) rotate(76deg) translateX(-26px) scale(1); transition-delay:0ms; }
    #ccSwissDock.open .cc-b2, #ccSwissDock:hover .cc-b2 { transform: translateY(-50%) rotate(52deg) translateX(-26px) scale(1); transition-delay:30ms; }
    #ccSwissDock.open .cc-b3, #ccSwissDock:hover .cc-b3 { transform: translateY(-50%) rotate(26deg) translateX(-26px) scale(1); transition-delay:60ms; }
    #ccSwissDock.open .cc-b4, #ccSwissDock:hover .cc-b4 { transform: translateY(-50%) rotate(0deg) translateX(-26px) scale(1); transition-delay:90ms; }
    #ccSwissDock .cc-b1:hover { transform: translateY(-50%) rotate(76deg) translateX(-32px) scale(1.09); border-color:#7c3aed; box-shadow:0 10px 26px rgba(15,23,42,0.26); }
    #ccSwissDock .cc-b2:hover { transform: translateY(-50%) rotate(52deg) translateX(-32px) scale(1.09); border-color:#7c3aed; box-shadow:0 10px 26px rgba(15,23,42,0.26); }
    #ccSwissDock .cc-b3:hover { transform: translateY(-50%) rotate(26deg) translateX(-32px) scale(1.09); border-color:#7c3aed; box-shadow:0 10px 26px rgba(15,23,42,0.26); }
    #ccSwissDock .cc-b4:hover { transform: translateY(-50%) rotate(0deg) translateX(-32px) scale(1.09); border-color:#7c3aed; box-shadow:0 10px 26px rgba(15,23,42,0.26); }
    #ccSwissBtn {
      position:relative; z-index:2; width:42px; height:42px;
      background:#ffffff; color:#7c3aed; border:1.5px solid #e2e8f0;
      border-radius:999px; font-size:16px; font-weight:800; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 14px rgba(15,23,42,0.18); transition: transform 0.25s ease, background 0.2s ease, color 0.2s ease;
    }
    #ccSwissDock.open #ccSwissBtn,
    #ccSwissDock:hover #ccSwissBtn { background:#7c3aed; color:#fff; transform: rotate(45deg) scale(1.08); }
  </style>
  <div id="ccSwissDock">
    <a href="/b/ai/" class="cc-blade cc-b1 active">🧠 AI NPU</a>
    <a href="/b/webchain/" class="cc-blade cc-b2">🏥 WebChain</a>
    <a href="/b/learnchain/" class="cc-blade cc-b3">🎓 LearnChain</a>
    <a href="/?hub=1" class="cc-blade cc-b4">🏠 CoreChain HUB</a>
    <button id="ccSwissBtn" type="button" onclick="document.getElementById('ccSwissDock').classList.toggle('open')" title="คลี่เมนู CoreChain HUB">⛓️</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">🧠</div>
      <div>
        <div class="brand-title">AI NPU</div>
        <div class="brand-sub">Think. Fast. Local. • Hexagon NPU Workspace</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="npuPill" class="pill">กำลังตรวจ NPU...</span>
      <button class="btn btn-ghost btn-sm" onclick="loadNPUStatus(true)">🔄 รีเฟรชสถานะ NPU</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleSettings()">⚙️ ตั้งค่า Endpoint</button>
    </div>
  </header>

  <main class="container">
    <section class="hw-card" id="hwCard">
      <div>
        <div class="hw-eyebrow">LOCAL HARDWARE ACCELERATOR</div>
        <h2 id="hwDeviceName">กำลังตรวจสอบฮาร์ดแวร์ NPU...</h2>
        <div class="hw-badges" id="hwBadges"></div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" id="btnBenchNPU" onclick="runNPUBenchmark()">⚡ ทดสอบรันงานเข้า NPU จริง</button>
          <button class="btn btn-sm hidden" id="btnToggleNPULLM" onclick="toggleNPULLM()">🧠 เปิด NPU LLM</button>
          <span id="npuBenchResult" class="muted"></span>
        </div>
        <div id="llamaBar" class="hidden" style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <select id="llamaModelSelect" style="padding:6px 10px;border:1px solid var(--border);border-radius:10px;font-size:12.5px;max-width:340px;"></select>
          <button class="btn btn-sm" id="btnStartLlama" style="background:#059669;border-color:#059669;color:#fff;" onclick="startLlamaServer()">▶ เปิดใช้ llama.cpp</button>
          <button class="btn btn-ghost btn-sm hidden" id="btnStopLlama" onclick="stopLlamaServer()">⏹ หยุด</button>
        </div>
      </div>
      <div class="hw-guide" id="hwGuide"></div>
    </section>

    <section id="settingsCard" class="panel hidden">
      <h3>⚙️ ตั้งค่า Local NPU / LLM Endpoint</h3>
      <div class="form-grid">
        <label>Endpoint URL (เว้นว่างเพื่อ Auto-Detect Foundry Local / Ollama)
          <input type="text" id="cfgEndpoint" placeholder="เช่น http://127.0.0.1:5272" />
        </label>
        <label>ชื่อโมเดล (เว้นว่างเพื่อใช้ตัวแรกที่โหลดอยู่)
          <input type="text" id="cfgModel" placeholder="เช่น qwen2.5-1.5b" />
        </label>
      </div>
      <label style="display:block;margin-top:10px;font-size:12.5px;font-weight:600;">System Prompt
        <input type="text" id="cfgSysNote" style="width:100%;margin-top:4px;" />
      </label>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="toggleSettings()">ปิด</button>
        <button class="btn btn-primary btn-sm" onclick="saveConfig()">บันทึก</button>
      </div>
    </section>

    <section class="panel">
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="chat" onclick="setMode('chat')">💬 ถาม-ตอบ AI</button>
        <button class="mode-tab" data-mode="summarize_web" onclick="setMode('summarize_web')">📝 สรุปข่าว WebChain</button>
        <button class="mode-tab" data-mode="quiz_learn" onclick="setMode('quiz_learn')">🎓 ออกข้อสอบ LearnChain</button>
        <button class="mode-tab" data-mode="analyze_doc" onclick="setMode('analyze_doc')">📄 วิเคราะห์เอกสาร DocChain</button>
      </div>

      <textarea id="promptInput" rows="4" placeholder="พิมพ์คำถาม หรือวางข้อความข่าว / เอกสาร / หัวข้อที่ต้องการให้ NPU ช่วยประมวลผล..."></textarea>
      <div class="prompt-actions">
        <span id="latencyBadge" class="muted"></span>
        <button class="btn btn-primary" id="btnSend" onclick="sendPrompt()">🚀 ประมวลผลด้วย AI</button>
      </div>

      <div id="replyBox" class="reply-box hidden"></div>
    </section>

    <section class="panel">
      <h3>🕘 ประวัติล่าสุด</h3>
      <div id="historyList" class="history-list">ยังไม่มีประวัติ</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
